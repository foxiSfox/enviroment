include:
  - ./templates/networks.yml
  - ./templates/volumes-media.yml

services:
  yt-scout:
    image: foxisfox/yt-scout:0.0.8
    container_name: yt-scout
    env_file:
      - ./services/media/yt-scout/.env.local
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        reservations:
          cpus: '0.25'
          memory: 64M
        limits:
          memory: "${SERVICE_MEDIA_YT_SCOUT_MEMORY_LIMITS:?}"
    volumes:
      - yt-scout-data:/app/data
      - ${MEDIA_PLEX_SMB_DIR:?}/media/youtube:/downloads
    expose:
      - 8000
    ports:
      - ${MEDIA_YT_SCOUT_PORT:?}:8000
    networks:
      - home-network
    restart: unless-stopped
